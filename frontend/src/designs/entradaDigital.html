<script>
        const ring = document.getElementById('timer-ring');
        const text = document.getElementById('timer-text');
        const radius = ring.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        
        ring.style.strokeDasharray = `${circumference} ${circumference}`;
        
        let timeLeft = 30;
        const totalTime = 30;

        function updateTimer() {
            const offset = circumference - (timeLeft / totalTime) * circumference;
            ring.style.strokeDashoffset = offset;
            text.textContent = `${Math.ceil(timeLeft)}s`;

            if (timeLeft <= 0) {
                timeLeft = 30;
                // Add a small visual feedback for the "regeneration"
                document.getElementById('qr-code').style.opacity = '0.5';
                setTimeout(() => {
                    document.getElementById('qr-code').style.opacity = '1';
                }, 200);
            } else {
                timeLeft -= 0.1;
            }
        }

        setInterval(updateTimer, 100);

        // Simple haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
